<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALOJAMIENTO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center; 
        }
        h1 {
            margin-bottom: 20px; 
        }
        .contenedor {
            display: flex; 
            justify-content: space-between; 
            max-width: 800px; 
            margin: 0 auto;
        }
        .imagenes {
            display: flex;
            flex-direction: column; 
            align-items: center; 
        }
        .imagenes figure {
            margin: 50px;
        }
        .imagenes img {
            width: 300px; 
            height: auto; 
            margin-bottom: 10px;
        }
        .imagenes2 img {
            width: 250px; 
            height: auto; 
            margin-bottom: 10px;
        }
        .boton {
            margin-top: 30px; 
            padding: 10px 20px;
            font-size: 16px; 
            background-color: #007BFF; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
        }
        .boton:hover {
            background-color: #0056b3; 
        }
    </style>
</head>
<body>

    <h1>ALOJAMIENTO</h1> 

    <div class="contenedor">
        <div class="imagenes">
            <figure>
                <img src="hotel las palmas.jpg" alt="Hotel Las Palmas">
                <figcaption>Hotel Las Palmas - Un lugar acogedor para descansar.</figcaption>
            </figure>
            <figure>
                <img src="hotel meson del agave.jpg" alt="Hotel Mesón del Agave">
                <figcaption>Hotel Mesón del Agave - Ideal para familias.</figcaption>
            </figure>
            <figure>
                <img src="hotel san fernando.jpg" alt="Foto 3">
                <figcaption>Hotel San Fernando- Ideal para toda la familia</figcaption>
            </figure>
        </div>
        
        <div class="imagenes2">
            <img src="las palmas.jpg" alt="Foto 4">
            <img src="meson del agave.jpg" alt="Foto 5">
            <img src="san fernando.jpg" alt="Foto 6">
        </div>
    </div>

    

   
    <a href="otra_pagina.html"> 
       
        <a href="index.html"><button>Regresar a la pagina principal</button></a>
    </a>

</body>
</html>
